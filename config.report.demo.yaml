---
database:
  dsn: "postgres://report:report@postgres:5432/backup_report?sslmode=disable"
capture:
  interval: "30s"
  timeout: "30s"
  retentionDays: 400
servers:
  - name: mock-ppdm-01
    tenant: acme-corp
    host: mockppdm
    port: 8443
    username: demo
    password: demo
    insecureSkipVerify: true
# Demo only: the report endpoint is published on 0.0.0.0 with NO authToken so the browser/curl
# demo works without a token. Do NOT use this posture in production — set authToken (a bearer
# token) and bind 127.0.0.1 or a private interface.
report:
  listen: "0.0.0.0:9103"
  brandName: "Acme Backup Assurance"
smtp:
  host: mailpit
  port: 1025
  from: "assurance@demo.local"
  starttls: false        # demo sink: no TLS/auth (Mailpit). NEVER do this in production.
schedules:
  - tenant: acme-corp
    cadence: daily
    hour: 0              # 00:00 UTC -> always "due" in the demo, sends on first tick
    recipients: [ops@acme-corp.demo]
