---
# End-to-end demo stack — exporter + backup reporter BUILT FROM SOURCE.
#   make demo            (brings it up detached and prints the URLs below; or: docker compose up --build)
# Open:
#   Grafana  http://localhost:3000 (admin/admin)
#            - "PowerProtect Data Manager — Overview"  (live exporter metrics)
#            - "PowerProtect — SLA Compliance"         (backup compliance over Postgres)
#   Report   http://localhost:9103/report?tenant=acme-corp  (&format=pdf for PDF)
#
# Services: mockppdm (fake PPDM server) -> ppdm_exporter -> prometheus -> grafana, plus
#   postgres + report (cmd/report captures history every 30s and serves the assurance report).
# mockppdm serves demo fixtures so the dashboards/report populate without real hardware.
services:
  mockppdm:
    build:
      context: .
      dockerfile: deploy/mockppdm/Dockerfile
    image: ppdm_mockppdm
    pull_policy: build
    container_name: ppdm_mockppdm
    restart: unless-stopped

  ppdm_exporter:
    build: .
    image: ppdm_exporter
    # Build-only image (no registry). Without this, `docker compose up` tries to pull
    # `ppdm_exporter` from Docker Hub and fails with access-denied.
    pull_policy: build
    container_name: ppdm_exporter
    command: ["--config", "/etc/ppdm_exporter/config.yaml"]
    ports:
      - "9442:9442"
    volumes:
      - ./config.demo.yaml:/etc/ppdm_exporter/config.yaml:ro
    depends_on:
      - mockppdm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9442/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: ppdm_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ppdm_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ppdm_grafana
    ports:
      - "3000:3000"
    environment:
      # Test-stack credentials (admin / admin). Change for anything non-local.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

  # --- Backup history (cmd/report) ---
  postgres:
    image: postgres:17-alpine
    container_name: ppdm_postgres
    environment:
      - POSTGRES_USER=report
      - POSTGRES_PASSWORD=report
      - POSTGRES_DB=backup_report
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d backup_report"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ppdm_mailpit
    ports:
      - "8025:8025"   # web UI; SMTP on 1025 is reachable in-network as mailpit:1025
    restart: unless-stopped

  report:
    build:
      context: .
      dockerfile: deploy/report/Dockerfile
    image: ppdm_report
    pull_policy: build
    container_name: ppdm_report
    command: ["--config", "/etc/report/config.report.yaml", "--debug"]
    ports:
      # On-demand assurance report: http://localhost:9103/report?tenant=acme-corp
      - "9103:9103"
    volumes:
      - ./config.report.demo.yaml:/etc/report/config.report.yaml:ro
    depends_on:
      mockppdm:
        condition: service_started
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
