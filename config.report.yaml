---
database:
  dsn: "postgres://report:${PG_PASSWORD}@localhost:5432/backup_report?sslmode=disable"
capture:
  interval: "1h"
  timeout: "5m"
  retentionDays: 400
servers:
  - name: ppdm-prod-01
    tenant: acme-corp
    host: ppdm01.example.com
    port: 8443
    username: ppdm-monitor
    password: "${PPDM01_PASSWORD}"
    insecureSkipVerify: true
